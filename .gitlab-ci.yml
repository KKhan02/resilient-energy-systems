# Isolated diagnostic only. Do not merge this file into research main.
workflow:
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
      when: always
    - when: never

stages:
  - diagnostic

research_runner_smoke:
  stage: diagnostic
  tags:
    - research-laptop
  rules:
    - if: '$RUNNER_DIAGNOSTIC == "science"'
      when: never
    - when: manual
  allow_failure: false
  timeout: 10m
  script:
    - |
      $ErrorActionPreference = 'Stop'
      Write-Output "RUNNER_DIAGNOSTIC_START"
      $identity = whoami
      Write-Output "Execution identity: $identity"
      if (($identity -split '\\')[-1] -ne 'researchrunner') { throw 'Unexpected runner account' }
      git --version
      if ($LASTEXITCODE -ne 0) { throw 'Git version check failed' }
      $actual = git rev-parse HEAD
      if ($LASTEXITCODE -ne 0 -or $actual -ne $env:CI_COMMIT_SHA) { throw 'Checkout SHA mismatch' }
      $pythonFound = [bool](Get-Command python -ErrorAction SilentlyContinue)
      $condaFound = [bool](Get-Command conda -ErrorAction SilentlyContinue)
      $report = [ordered]@{
        status = 'PASS'
        commit = $actual
        runner_id = $env:CI_RUNNER_ID
        execution_account = 'researchrunner'
        os = $env:OS
        python_command_found = $pythonFound
        conda_command_found = $condaFound
        timestamp_utc = [DateTime]::UtcNow.ToString('o')
      }
      New-Item -ItemType Directory -Path runner-test -Force | Out-Null
      $report | ConvertTo-Json | Set-Content -Path runner-test/diagnostic.json -Encoding UTF8
      Get-Content runner-test/diagnostic.json
      Write-Output "RUNNER_DIAGNOSTIC_PASS"
  artifacts:
    when: always
    paths:
      - runner-test/diagnostic.json
    expire_in: 7 days

research_runner_science:
  stage: diagnostic
  tags:
    - research-laptop
  rules:
    - if: '$RUNNER_DIAGNOSTIC == "science"'
      when: manual
    - when: never
  allow_failure: false
  timeout: 10m
  script:
    - |
      $ErrorActionPreference = 'Stop'
      if (((whoami) -split '\\')[-1] -ne 'researchrunner') { throw 'Unexpected runner account' }
      $conda = Join-Path $env:USERPROFILE 'miniforge3\Scripts\conda.exe'
      if (!(Test-Path $conda)) { throw 'Miniforge executable missing' }
      & $conda run -n research python -m pip check
      if ($LASTEXITCODE -ne 0) { throw 'pip check failed' }
      $env:MPLBACKEND = 'Agg'
      & $conda run --no-capture-output -n research python runner_setup/scientific_smoke.py
      if ($LASTEXITCODE -ne 0) { throw 'Scientific smoke failed' }
  artifacts:
    when: always
    paths:
      - runner-test/
    expire_in: 7 days
