# Isolated scientific execution branch. Never merge into main or sync.
workflow:
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "execution/research-94022-stress-2026-11-26"'
      when: always
    - when: never
stages:
  - preflight
  - research
.remote_research:
  stage: research
  tags:
    - research-laptop
  resource_group: research-laptop-science
  allow_failure: false
  interruptible: false
  timeout: 5h 45m
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "1"
    MPLBACKEND: Agg
    PYTHONUNBUFFERED: "1"
  script:
    - |
      $ErrorActionPreference = 'Stop'
      $session = (Get-Process -Id $PID).SessionId
      if (((whoami) -split '\\')[-1] -ne 'researchrunner' -or $session -ne 0) { throw 'Expected restricted service account and Session 0' }
      if ($env:CI_RUNNER_ID -ne '60033802' -or $env:CI_PROJECT_ID -ne '88036556' -or $env:CI_COMMIT_REF_PROTECTED -ne 'true') { throw 'Runner/project/protection mismatch' }
      $actual = git rev-parse HEAD
      if ($LASTEXITCODE -ne 0 -or $actual -ne $env:CI_COMMIT_SHA) { throw 'Checkout SHA mismatch' }
      $conda = 'C:\Users\ResearchRunner\miniforge3\Scripts\conda.exe'
      if (!(Test-Path -LiteralPath $conda -PathType Leaf)) { throw 'Validated Conda executable missing' }
      $env:RUNNER_VERIFIED_SESSION_ID = "$session"
      $env:NUMBA_CACHE_DIR = Join-Path $env:CI_PROJECT_DIR 'remote-cache\numba'
      $study = 'case1/studies/SEEDExchange_StudyB_Integration_v1'
      $archive = Join-Path $env:CI_PROJECT_DIR "$study/outputs/b3_qualified_2026-11-27/B3_SIGNED_NUMERICAL_TABLES.zip"
      if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '96f2df6e1c73215f8701fd9822e0f4e65761de98026c4dd1a89cd80ae3bffa2c') { throw 'Archived B3 source hash mismatch' }
      $b31 = Join-Path $env:CI_PROJECT_DIR "$study/outputs/b31_2026-11-28/B31_NUMERICAL_TABLES.zip"
      if ((Get-FileHash -LiteralPath $b31 -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'e6e3eee673e0436c46916df1cfbe0384ffbb72444ed4088530c79c96f681f606') { throw 'Archived B31 hash mismatch' }
      & $conda run --no-capture-output -n research python -m py_compile "$study/qualify_and_plot_b31.py"
      if ($LASTEXITCODE -ne 0) { throw 'Syntax failed' }
      & $conda run --no-capture-output -n research python "$study/qualify_and_plot_b31.py" --out remote-research/study-b-b31-qualified --emit
      if ($LASTEXITCODE -ne 0) { throw 'Qualification failed; do not bypass' }
  artifacts:
    when: always
    paths:
      - remote-research/
    expire_in: 90 days

study_b_b31_qualification:
  extends: .remote_research
  stage: research
  timeout: 20m
