# Isolated scientific execution branch. Never merge into main or sync.
workflow:
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "execution/research-94022-stress-2026-11-26"'
      when: always
    - when: never
stages:
  - preflight
  - research
.remote_research:
  stage: research
  tags:
    - research-laptop
  resource_group: research-laptop-science
  allow_failure: false
  interruptible: false
  timeout: 5h 45m
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "1"
    MPLBACKEND: Agg
    PYTHONUNBUFFERED: "1"
  script:
    - |
      $ErrorActionPreference = 'Stop'
      $session = (Get-Process -Id $PID).SessionId
      if (((whoami) -split '\\')[-1] -ne 'researchrunner' -or $session -ne 0) { throw 'Expected restricted service account and Session 0' }
      if ($env:CI_RUNNER_ID -ne '60033802' -or $env:CI_PROJECT_ID -ne '88036556' -or $env:CI_COMMIT_REF_PROTECTED -ne 'true') { throw 'Runner/project/protection mismatch' }
      $actual = git rev-parse HEAD
      if ($LASTEXITCODE -ne 0 -or $actual -ne $env:CI_COMMIT_SHA) { throw 'Checkout SHA mismatch' }
      $conda = 'C:\Users\ResearchRunner\miniforge3\Scripts\conda.exe'
      if (!(Test-Path -LiteralPath $conda -PathType Leaf)) { throw 'Validated Conda executable missing' }
      $env:RUNNER_VERIFIED_SESSION_ID = "$session"
      $env:NUMBA_CACHE_DIR = Join-Path $env:CI_PROJECT_DIR 'remote-cache\numba'
      $researchArgs = @()
      if ($env:CI_JOB_NAME -eq 'study_a_94022_middle_night_preflight') { $researchArgs = @('--preflight-only') }
      elseif ($env:CI_JOB_NAME -ne 'study_a_94022_middle_night_screen') { throw 'Unexpected scientific job' }
      & $conda run --no-capture-output -n research python case1/studies/SEEDExchange_StudyA_Battery_Closure_2026-11-24/remote_94022_middle_night.py @researchArgs
      if ($LASTEXITCODE -ne 0) { throw 'Scientific job failed; inspect artifacts and report' }
  artifacts:
    when: always
    paths:
      - remote-research/
    expire_in: 90 days

study_a_94022_middle_night_preflight:
  extends: .remote_research
  stage: preflight
  timeout: 20m
  when: on_success

study_a_94022_middle_night_screen:
  extends: .remote_research
  stage: research
  when: on_success
  needs:
    - job: study_a_94022_middle_night_preflight
      artifacts: false
