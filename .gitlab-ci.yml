stages:
  - test

case1_unit_tests:
  image: python:3.11-slim
  stage: test
  variables:
    MPLBACKEND: "Agg"
    NUMBA_CACHE_DIR: "/tmp/numba_cache"
  before_script:
    - python -m pip install -r case1/requirements.txt
  script:
    - cd case1
    - python -m pytest tests/test_wp1_v3.py -q --junitxml=test-results.xml
  artifacts:
    when: always
    reports:
      junit: case1/test-results.xml
