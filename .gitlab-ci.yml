# Lightweight Case 1 model verification; annual sweeps remain researcher-run.
# `python -m pytest` (not bare pytest) preserves case1/ on sys.path.
stages:
  - test

case1_unit_tests:
  stage: test
  image: python:3.11-slim
  variables:
    MPLBACKEND: "Agg"
    NUMBA_CACHE_DIR: "/tmp/numba_cache"
  before_script:
    - python -m pip install -r case1/requirements.txt
  script:
    - cd case1
    - python -m pytest tests/test_wp1_v3.py -q --junitxml=test-results.xml
  artifacts:
    when: always
    reports:
      junit: case1/test-results.xml

case1_legacy_baseline_tests:
  stage: test
  image: python:3.11-slim
  variables:
    MPLBACKEND: "Agg"
    NUMBA_CACHE_DIR: "/tmp/numba_cache"
  before_script:
    - python -m pip install -r case1/legacy/independent_case1_original/requirements.txt
    - python -m pip freeze | grep -E '^(numpy|pandas|pvlib|pypsa|pandapower|highspy|pytest)=='
  script:
    - cd case1
    - PYTHONPATH=legacy/independent_case1_original python -m pytest legacy/independent_case1_original/tests/test_case1.py -q --junitxml=legacy-results.xml
  artifacts:
    when: always
    reports:
      junit: case1/legacy-results.xml


# Site A explanatory solar-access scenarios; no change to Case 1 results.
case1_site_a_solar_screen:
  stage: test
  image: python:3.11-slim
  variables:
    MPLBACKEND: "Agg"
    NUMBA_CACHE_DIR: "/tmp/numba_cache"
  before_script:
    - python -m pip install -r case1/requirements.txt
  script:
    - cd case1
    - python -m pytest studies/site_a_solar/tests/test_solar_access.py -q --junitxml=site-a-tests.xml
    - python studies/site_a_solar/solar_access_pvlib.py --weather data/NASA_POWER_SanRafael_hourly_2025.csv --outdir site_a_solar_ci_results
  artifacts:
    when: always
    paths:
      - case1/site_a_solar_ci_results/
    reports:
      junit: case1/site-a-tests.xml


# Source-only check: recompute original digitized network lengths/group counts.
# No pandapower simulation and no claims of existing connection verification.
case1_original_spatial_source_audit:
  stage: test
  image: python:3.11-slim
  script:
    - cd case1
    - python -m unittest discover -s studies/spatial_electrical_reconciliation -p 'test_*.py' -v
    - python studies/spatial_electrical_reconciliation/audit_sources.py --output spatial_source_audit_result.json
  artifacts:
    when: always
    paths:
      - case1/spatial_source_audit_result.json


# Provisional 35-property image registration; no EPM/customer assignment assumptions.
case1_community_georef_tests:
  stage: test
  image: python:3.11-slim
  script:
    - cd case1/studies/community_georef
    - python -m unittest discover -p 'test_*.py' -v
    - python georeference.py --outdir /tmp/san_rafael_georef_rebuild
  artifacts:
    when: always
    paths:
      - case1/studies/community_georef/georeferencing_diagnostics.json

# Read-only bounded public infrastructure layers. Network failures are recorded,
# not misreported as no EPM assets. This job cannot validate LV service territories.
case1_epm_public_gis_probe:
  stage: test
  image: python:3.11-slim
  script:
    - cd case1/studies/community_georef
    - python epm_fetch.py --outdir epm_probe_artifacts --timeout 9
  artifacts:
    when: always
    paths:
      - case1/studies/community_georef/epm_probe_artifacts/


# Review of user-supplied EPM screenshots and 35 mapped locations.
# Data-only electrical evidence gate: no nodal pandapower run or transformer inventing.
case1_20261027_field_review:
  stage: test
  image: python:3.11-slim
  script:
    - cd case1/studies/community_georef/field_review_2026_10_27
    - python -m unittest discover -p 'test_*.py' -v
  artifacts:
    when: always
    paths:
      - case1/studies/community_georef/field_review_2026_10_27/review_findings.json


# Archive-only saved pandapower v5 evidence; no new power-flow simulation.
case1_saved_v5_constraint_gate:
