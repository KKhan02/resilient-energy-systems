# Isolated scientific execution branch. Never merge into main or sync.
workflow:
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "execution/research-94022-stress-2026-11-26"'
      when: always
    - when: never
stages:
  - preflight
  - research
.remote_research:
  stage: research
  tags:
    - research-laptop
  resource_group: research-laptop-science
  allow_failure: false
  interruptible: false
  timeout: 5h 45m
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "1"
    MPLBACKEND: Agg
    PYTHONUNBUFFERED: "1"
  script:
    - |
      $ErrorActionPreference = 'Stop'
      $session = (Get-Process -Id $PID).SessionId
      if (((whoami) -split '\\')[-1] -ne 'researchrunner' -or $session -ne 0) { throw 'Expected restricted service account and Session 0' }
      if ($env:CI_RUNNER_ID -ne '60033802' -or $env:CI_PROJECT_ID -ne '88036556' -or $env:CI_COMMIT_REF_PROTECTED -ne 'true') { throw 'Runner/project/protection mismatch' }
      $actual = git rev-parse HEAD
      if ($LASTEXITCODE -ne 0 -or $actual -ne $env:CI_COMMIT_SHA) { throw 'Checkout SHA mismatch' }
      $conda = 'C:\Users\ResearchRunner\miniforge3\Scripts\conda.exe'
      if (!(Test-Path -LiteralPath $conda -PathType Leaf)) { throw 'Validated Conda executable missing' }
      $env:RUNNER_VERIFIED_SESSION_ID = "$session"
      $env:NUMBA_CACHE_DIR = Join-Path $env:CI_PROJECT_DIR 'remote-cache\numba'
      $study = 'case1/studies/SEEDExchange_StudyB_Integration_v1'
      $zip = Join-Path $env:CI_PROJECT_DIR 'b3-retained.zip'
      $uri = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/jobs/18436937794/artifacts"
      $downloaded = $false
      try {
        Invoke-WebRequest -UseBasicParsing -Uri $uri -Headers @{'JOB-TOKEN'=$env:CI_JOB_TOKEN} -OutFile $zip -ErrorAction Stop
        $downloaded = $true
      } catch {
        Write-Output 'B3 retained archive not accessible through scoped job token; using bounded identical replay.'
      }
      if ($downloaded) {
        Expand-Archive -LiteralPath $zip -DestinationPath retained-b3
        & $conda run --no-capture-output -n research python "$study/recover_b3_failed_report.py" --root . --archive-root retained-b3/remote-research --out remote-research/study-b-b3
        if ($LASTEXITCODE -ne 0) { throw 'B3 retained archive validation failed; do not overwrite or bypass evidence' }
      } else {
        & $conda run --no-capture-output -n research python "$study/build_independent_b1.py" --repo-root . --out remote-research/study-b-b1
        if ($LASTEXITCODE -ne 0) { throw 'B1 replay failed' }
        & $conda run --no-capture-output -n research python "$study/qualify_b1_tradeoffs.py" --input remote-research/study-b-b1 --out remote-research/study-b-b1-qualification
        if ($LASTEXITCODE -ne 0) { throw 'B1 qualification failed' }
        & $conda run --no-capture-output -n research python "$study/run_b3_load_only_pilot.py" --repo-root . --b1 remote-research/study-b-b1 --qualification remote-research/study-b-b1-qualification --out remote-research/study-b-b3
        if ($LASTEXITCODE -ne 0) { throw 'B3 replay failed' }
      }
  artifacts:
    when: always
    paths:
      - remote-research/
    expire_in: 90 days

study_b_b3_recover_or_replay:
  extends: .remote_research
  stage: research
  when: on_success
