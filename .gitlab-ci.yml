# Isolated diagnostic only. Do not merge this file into research main.
workflow:
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
      when: always
    - when: never

stages:
  - diagnostic

research_runner_smoke:
  stage: diagnostic
  tags:
    - research-laptop
  when: manual
  allow_failure: true
  timeout: 10m
  script:
    - |
      $ErrorActionPreference = 'Stop'
      Write-Output "RUNNER_DIAGNOSTIC_START"
      $identity = whoami
      Write-Output "Execution identity: $identity"
      if (($identity -split '\\')[-1] -ne 'researchrunner') { throw 'Unexpected runner account' }
      git --version
      if ($LASTEXITCODE -ne 0) { throw 'Git version check failed' }
      $actual = git rev-parse HEAD
      if ($LASTEXITCODE -ne 0 -or $actual -ne $env:CI_COMMIT_SHA) { throw 'Checkout SHA mismatch' }
      $pythonFound = [bool](Get-Command python -ErrorAction SilentlyContinue)
      $condaFound = [bool](Get-Command conda -ErrorAction SilentlyContinue)
      $report = [ordered]@{
        status = 'PASS'
        commit = $actual
        runner_id = $env:CI_RUNNER_ID
        execution_account = 'researchrunner'
        os = $env:OS
        python_command_found = $pythonFound
        conda_command_found = $condaFound
        timestamp_utc = [DateTime]::UtcNow.ToString('o')
      }
      New-Item -ItemType Directory -Path runner-test -Force | Out-Null
      $report | ConvertTo-Json | Set-Content -Path runner-test/diagnostic.json -Encoding UTF8
      Get-Content runner-test/diagnostic.json
      Write-Output "RUNNER_DIAGNOSTIC_PASS"
  artifacts:
    when: always
    paths:
      - runner-test/diagnostic.json
    expire_in: 7 days

research_runner_science:
  stage: diagnostic
  tags:
    - research-laptop
  when: manual
  allow_failure: false
  timeout: 10m
  script:
    - |
      $ErrorActionPreference = 'Stop'
      if (((whoami) -split '\\')[-1] -ne 'researchrunner') { throw 'Unexpected runner account' }
      New-Item -ItemType Directory -Path runner-test -Force | Out-Null
      $profile = [Environment]::GetFolderPath('UserProfile')
      Write-Output "Runner profile: $profile"
      Write-Output "USERPROFILE: $env:USERPROFILE"
      $roots = @((Join-Path $profile 'miniforge3'), (Join-Path $env:USERPROFILE 'miniforge3'), (Join-Path $env:LOCALAPPDATA 'miniforge3'), (Join-Path $env:LOCALAPPDATA 'Programs\miniforge3'), (Join-Path $env:ProgramData 'miniforge3'), 'C:\Miniforge3') | Select-Object -Unique
      $candidates = foreach ($root in $roots) {
        foreach ($relative in @('Scripts\conda.exe', 'condabin\conda.bat')) {
          $path = Join-Path $root $relative
          [pscustomobject]@{ path = $path; exists = (Test-Path -LiteralPath $path -PathType Leaf) }
        }
      }
      $candidates | ConvertTo-Json | Set-Content -Path runner-test/conda-discovery.json -Encoding UTF8
      Get-Content runner-test/conda-discovery.json
      $conda = ($candidates | Where-Object exists | Select-Object -First 1).path
      if (!$conda) { throw 'Miniforge not found in expected runner or shared installation locations' }
      Write-Output "Conda executable: $conda"
      & $conda --version
      if ($LASTEXITCODE -ne 0) { throw 'Conda version check failed' }
      & $conda run -n research python -c "import sys; print('Research Python:', sys.executable); print(sys.version)"
      if ($LASTEXITCODE -ne 0) { throw 'Research environment unavailable' }
      & $conda run -n research python -m pip check
      if ($LASTEXITCODE -ne 0) { throw 'pip check failed' }
      $env:MPLBACKEND = 'Agg'
      & $conda run --no-capture-output -n research python runner_setup/scientific_smoke.py
      if ($LASTEXITCODE -ne 0) { throw 'Scientific smoke failed' }
  artifacts:
    when: always
    paths:
      - runner-test/
    expire_in: 7 days

research_runner_project_validation:
  stage: diagnostic
  tags:
    - research-laptop
  when: manual
  allow_failure: false
  timeout: 10m
  script:
    - |
      $ErrorActionPreference = 'Stop'
      New-Item -ItemType Directory -Path runner-test -Force | Out-Null
      $identity = whoami
      $session = (Get-Process -Id $PID).SessionId
      Write-Output "SERVICE_SESSION_ID=$session"
      if (($identity -split '\\')[-1] -ne 'researchrunner' -or $session -ne 0) { throw 'Expected restricted non-interactive service session' }
      $actual = git rev-parse HEAD
      if ($LASTEXITCODE -ne 0 -or $actual -ne $env:CI_COMMIT_SHA) { throw 'Checkout SHA mismatch' }
      $env:RUNNER_VERIFIED_SESSION_ID = "$session"
      $env:MPLBACKEND = 'Agg'
      $env:NUMBA_CACHE_DIR = Join-Path $env:CI_PROJECT_DIR 'runner-test\numba-cache'
      $conda = Join-Path $env:USERPROFILE 'miniforge3\Scripts\conda.exe'
      if (!(Test-Path -LiteralPath $conda)) { throw 'Conda missing' }
      & $conda run --no-capture-output -n research python runner_setup/project_validation.py
      if ($LASTEXITCODE -ne 0) { throw 'Project validation failed' }
  artifacts:
    when: always
    paths:
      - runner-test/project/
    reports:
      junit: runner-test/project/junit.xml
    expire_in: 30 days
