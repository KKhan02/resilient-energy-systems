# Isolated scientific execution branch. Never merge into main or sync.
workflow:
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "execution/research-94022-stress-2026-11-26"'
      when: always
    - when: never
stages:
  - preflight
  - research
.remote_research:
  stage: research
  tags:
    - research-laptop
  resource_group: research-laptop-science
  allow_failure: false
  interruptible: false
  timeout: 5h 45m
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "1"
    MPLBACKEND: Agg
    PYTHONUNBUFFERED: "1"
  script:
    - |
      $ErrorActionPreference = 'Stop'
      $session = (Get-Process -Id $PID).SessionId
      if (((whoami) -split '\\')[-1] -ne 'researchrunner' -or $session -ne 0) { throw 'Expected restricted service account and Session 0' }
      if ($env:CI_RUNNER_ID -ne '60033802' -or $env:CI_PROJECT_ID -ne '88036556' -or $env:CI_COMMIT_REF_PROTECTED -ne 'true') { throw 'Runner/project/protection mismatch' }
      $actual = git rev-parse HEAD
      if ($LASTEXITCODE -ne 0 -or $actual -ne $env:CI_COMMIT_SHA) { throw 'Checkout SHA mismatch' }
      $conda = 'C:\Users\ResearchRunner\miniforge3\Scripts\conda.exe'
      if (!(Test-Path -LiteralPath $conda -PathType Leaf)) { throw 'Validated Conda executable missing' }
      $env:RUNNER_VERIFIED_SESSION_ID = "$session"
      $env:NUMBA_CACHE_DIR = Join-Path $env:CI_PROJECT_DIR 'remote-cache\numba'
      $study = 'case1/studies/SEEDExchange_StudyB_Integration_v1'
      $archive = Join-Path $env:CI_PROJECT_DIR "$study/outputs/b3_qualified_2026-11-27/B3_SIGNED_NUMERICAL_TABLES.zip"
      if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '96f2df6e1c73215f8701fd9822e0f4e65761de98026c4dd1a89cd80ae3bffa2c') { throw 'Archived B3 source hash mismatch' }
      if ($env:CI_JOB_NAME -eq 'study_b_b3_layout_revision') {
        Expand-Archive -LiteralPath $archive -DestinationPath b3-input
        & $conda run --no-capture-output -n research python -m py_compile case1/professor_walkthrough/revise_study_b_b3_layout.py
        if ($LASTEXITCODE -ne 0) { throw 'Layout syntax failed' }
        & $conda run --no-capture-output -n research python case1/professor_walkthrough/revise_study_b_b3_layout.py --b3 b3-input/b3 --qualified b3-input/qualified --out remote-research/study-b-b3-layout --emit
        if ($LASTEXITCODE -ne 0) { throw 'Layout correction failed' }
      } elseif ($env:CI_JOB_NAME -eq 'study_b_b31_preflight') {
        & $conda run --no-capture-output -n research python -m py_compile "$study/run_b31_transformer_conductor_sensitivity.py"
        if ($LASTEXITCODE -ne 0) { throw 'B31 syntax failed' }
        & $conda run --no-capture-output -n research python "$study/build_independent_b1.py" --repo-root . --out remote-research/study-b-b1
        if ($LASTEXITCODE -ne 0) { throw 'Frozen geometry replay failed' }
        & $conda run --no-capture-output -n research python "$study/run_b31_transformer_conductor_sensitivity.py" --repo-root . --b1 remote-research/study-b-b1 --out remote-research/study-b-b31 --preflight-only
        if ($LASTEXITCODE -ne 0) { throw 'B31 preflight failed; do not bypass' }
      } elseif ($env:CI_JOB_NAME -eq 'study_b_b31_sensitivity') {
        if (!(Test-Path -LiteralPath remote-research/study-b-b1/manifest.json -PathType Leaf)) { throw 'Expected same-pipeline frozen geometry artifact missing' }
        & $conda run --no-capture-output -n research python "$study/run_b31_transformer_conductor_sensitivity.py" --repo-root . --b1 remote-research/study-b-b1 --out remote-research/study-b-b31
        if ($LASTEXITCODE -ne 0) { throw 'B31 sensitivity failed; inspect retained results' }
      } else { throw 'Unexpected scientific job' }
  artifacts:
    when: always
    paths:
      - remote-research/
    expire_in: 90 days

study_b_b3_layout_revision:
  extends: .remote_research
  stage: research
  needs: []
  timeout: 20m

study_b_b31_preflight:
  extends: .remote_research
  stage: preflight
  timeout: 30m

study_b_b31_sensitivity:
  extends: .remote_research
  stage: research
  needs:
    - job: study_b_b31_preflight
      artifacts: true
