<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" width="1400" height="850" role="img" aria-labelledby="t desc"><title id="t">Study A: Annual community cost, imports and PV curtailment</title><desc id="desc">34-house A0/A1 equipment-sized original energy alternatives. Higher self-sufficiency tiers lower imported kWh but increase annualized costs and DC solar curtailment. Four data points from the architecture-specific source, not a complete matched-hardware AC comparison.</desc><rect x="0" y="0" width="1400" height="850" rx="0" fill="#fff"/><text x="55" y="66" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="bold" fill="#1d3447" text-anchor="start">Community sizing: imports fall, cost and curtailment can rise</text><text x="57" y="108" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="normal" fill="#526579" text-anchor="start">Study A | Same 34 synthetic households, 2025 | Architecture-specific equipment | Energy-only</text><rect x="52" y="146" width="807" height="556" rx="12" fill="#f6f9fb"/><rect x="884" y="146" width="459" height="556" rx="12" fill="#f6f9fb"/><text x="87" y="189" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="bold" fill="#1d3447" text-anchor="start">Grid imports versus annual modelled cost</text><text x="87" y="217" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" fill="#526579" text-anchor="start">Each line links minimum-cost to higher-SS equipment, not identical hardware</text><text x="914" y="189" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="bold" fill="#1d3447" text-anchor="start">Annual DC PV curtailment</text><text x="914" y="217" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" fill="#526579" text-anchor="start">MWh/year, higher-SS can curtail more PV</text><line x1="146" y1="264" x2="146" y2="628" stroke="#dce4e9" stroke-width="1" stroke-dasharray="4 5"/><text x="146" y="658" font-family