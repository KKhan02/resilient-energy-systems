); connected hourly samples, not sub-hourly measurements.</text><text x="55" y="791" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" fill="#b56837" text-anchor="start">Annual greedy replay has two grid-import proxy violations; this is not an AC-feasible controller.</text><text x="55" y="818" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#526579" text-anchor="start">Sources: signed MC_P33 energy_hourly_2025.csv and archived MC_P33_CAUSAL_PV_FIRST_8760.csv.</text></svg>
