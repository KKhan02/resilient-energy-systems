" text-anchor="start">+413</text><text x="739" y="464" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#617387" font-weight="bold" >A1-sourced | min cost</text><rect x="927.6863630955605" y="478" width="107.31363690443943" height="30" fill="#28618e" rx="3"/><text x="917.6863630955605" y="500" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#28618e" font-weight="bold" text-anchor="end">-310</text><text x="739" y="561" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#617387" font-weight="bold" >A1-sourced | SS90</text><rect x="814.0166825747151" y="575" width="220.98331742528484" height="30" fill="#28618e" rx="3"/><text x="804.0166825747151" y="597" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#28618e" font-weight="bold" text-anchor="end">-639</text><rect x="76" y="696" width="22" height="17" fill="#28618e" rx="3"/><text x="108" y="710" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#1b3449"  >A1 assignment lowers metric</text><rect x="430" y="696" width="22" height="17" fill="#b34b45" rx="3"/><text x="462" y="710" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#1b3449"  >A1 assignment raises metric</text><line x1="58" y1="731" x2="1342" y2="731" stroke="#d8e0e8" stroke-width="1.2" /><text x="60" y="764" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#1b3449" font-weight="bold" >Equipment origins: A0 vs A1 sizing sets; min cost and higher self-sufficiency (SS90) tiers.</text><text x="60" y="793" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#617387"  >Source: 120c4e96, MATCHED_A0_VS_A1_SAME_HARDWARE_PAIRS.csv. Energy-only; excludes AC losses, network CAPEX and field approval.</text></svg>
