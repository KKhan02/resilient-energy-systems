<title id="title">34-house matched-hardware assignment contrast</title><desc id="desc">Four controlled same-hardware pairs show that A1 minus A0 changes sign according to the hardware origin. Energy-only costs and imports, not full network AC approval.</desc>
<rect x="0" y="0" width="1400" height="830" fill="#fff" rx="0"/><text x="58" y="66" font-family="Arial,Helvetica,sans-serif" font-size="36" fill="#1b3449" font-weight="bold" >No universal winner between the A0 and A1 assignments</text><text x="60" y="103" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#617387"  >34 identical synthetic households | fixed hardware within each pair | delta = A1 assignment minus A0</text><rect x="52" y="136" width="640" height="534" fill="#f4f7fa" rx="13"/><rect x="710" y="136" width="640" height="534" fill="#f4f7fa" rx="13"/><text x="82" y="183" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#1b3449" font-weight="bold" >Change in annual grid imports</text><text x="82" y="212" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#617387"  >kWh/year, energy-only optimizer</text><text x="740" y="183" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#1b3449" font-weight="bold" >Change in annual model cost</text><text x="740" y="212" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#617387"  >USD/year, equipment + purchased grid energy</text><line x1="372" y1="247" x2="372" y2="635" stroke="#758698" stroke-width="2.5" /><line x1="178.4" y1="250" x2="178.4" y2="630" stroke="#d8e0e8" stroke-width="1" stroke-dasharray="3 4"/><text x="178.4" y="654" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#617387"  text-anchor="middle">-2000</text><line x1="275.2" y1="250" x2="275.2" y2="630" stroke="#d8e0e8" stroke-width="1" stroke-dasharray="3 4"/><text x="275.2" y="654" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#617387"  text-anchor="middle">-1000</text><line x1="372" y1="250" x2="372" y2="630" stroke="#6b7f93" stroke-width="1.5" /><text x="372" y="654" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#617387"  text-anchor="middle">0</text><line x1="468.8" y1="250" x2="468.8" y2="630" stroke="#d8e0e8" stroke-width="1" stroke-dasharray="3 4"